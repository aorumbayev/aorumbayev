name: stats

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the renderer
        uses: actions/checkout@v7
        with:
          repository: anuraghazra/github-readme-stats
          ref: 54a7985aeefda00d5eadb55b80c17c7f976c37d2
          path: .stats-src

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci --omit=dev --ignore-scripts
        working-directory: .stats-src

      - run: node scripts/generate-stats.mjs
        env:
          PAT_1: ${{ secrets.PAT_1 }}

      # The card lives on the unprotected stats branch, so GITHUB_TOKEN can push
      # it without a bypass on master's branch protection.
      - name: Publish to the stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin stats
          git worktree add -B stats published FETCH_HEAD
          cp stats.svg published/stats.svg
          cd published
          git add stats.svg
          if git diff --cached --quiet; then
            echo "card unchanged"
            exit 0
          fi
          git commit -m "chore: refresh stats card"
          git push origin stats
